<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Todos</h1>
    <section class="lists">
      <div class="list-tabs" role="group" aria-label="Lists"></div>
      <div class="list-actions">
        <button type="button" id="add-list" class="quiet">New list</button>
        <button type="button" id="rename-list" class="quiet">Rename list</button>
        <button type="button" id="delete-list" class="quiet">Delete list</button>
      </div>
      <form id="list-name" hidden>
        <label for="list-name-text" class="visually-hidden">List name</label>
        <input id="list-name-text" maxlength="40" autocomplete="off">
        <button type="submit">Save</button>
        <button type="button" id="list-name-cancel" class="quiet">Cancel</button>
      </form>
      <p id="list-message" aria-live="polite"></p>
    </section>
    <form id="new-todo">
      <label for="todo-text" class="visually-hidden">New todo</label>
      <input id="todo-text" placeholder="What needs doing?" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <footer>
      <div class="status">
        <p id="count" aria-live="polite"></p>
        <button type="button" id="complete-all" class="quiet">Mark all as done</button>
      </div>
      <div class="filters" role="group" aria-label="Show">
        <button type="button" class="filter" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" class="filter" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button type="button" id="clear-completed" class="quiet">Clear completed</button>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
